name: Build Android 13 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android 13 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android 13 APK
        run: |
          yes | sdkmanager --licenses || true
          cd mobile/android
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dstock-pos-android13
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish Build Summary
        if: always()
        run: |
          echo "## Android 13 APK Build Log" >> $GITHUB_STEP_SUMMARY
          if [ -f mobile/android/build.log ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 mobile/android/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No build log generated." >> $GITHUB_STEP_SUMMARY
          fi
