name: Build Android 13 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android 13 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > mobile/android/local.properties
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build Android 13 Release APK
        run: |
          set -e
          set -o pipefail
          cd mobile/android
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dstock-pos-android13
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: mobile/android/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish Build Summary
        if: always()
        run: |
          echo "## Android 13 APK Build Summary" >> $GITHUB_STEP_SUMMARY
          if ls mobile/android/app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            echo "### ✅ Build Success!" >> $GITHUB_STEP_SUMMARY
            echo "APK ready for download in the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build Failed or APK Not Found" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f mobile/android/build.log ]; then
            echo '<details><summary>Click to view build log (last 100 lines)</summary>' >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 mobile/android/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo '</details>' >> $GITHUB_STEP_SUMMARY
          fi
