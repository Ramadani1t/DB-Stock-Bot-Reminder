name: Build Android 13 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android 13 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses & Build APK
        run: |
          yes | sdkmanager --licenses || true
          cd mobile/android
          gradle assembleRelease --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dstock-pos-android13
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Print Gradle Error Details
        if: failure()
        run: |
          echo "=== BUILD REPORTS / LOGS ==="
          ls -la mobile/android/app/build/ || true
          find mobile/android/app/build -name "*.txt" -o -name "*.log" | xargs head -n 100 || true
